name: Deploy to Firebase Hosting & Rules

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project (Vite + Server Bundle)
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Verifying dist folder contents:"
          ls -la dist/
          test -f dist/index.html || { echo "Error: dist/index.html missing!"; exit 1; }

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_VANJARIJODI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANJARIJODI }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ADMINSDK: ${{ secrets.FIREBASE_ADMINSDK }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          SA_CONTENT="${FIREBASE_SERVICE_ACCOUNT_VANJARIJODI:-${FIREBASE_SERVICE_ACCOUNT:-${FIREBASE_ADMINSDK:-${FIREBASE_JSON:-$FIREBASE_CREDENTIALS}}}}"
          if [ -n "$SA_CONTENT" ]; then
            echo "Deploying to Firebase Hosting with Service Account credentials..."
            echo "$SA_CONTENT" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools deploy --only hosting --project vanjarijodi --non-interactive
            npx --yes firebase-tools deploy --only firestore:rules --project vanjarijodi --non-interactive || echo "Note: Firestore rules deploy skipped"
            rm -f /tmp/firebase-sa.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase Hosting with Firebase Token..."
            npx --yes firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project vanjarijodi --non-interactive
            npx --yes firebase-tools deploy --only firestore:rules --token "$FIREBASE_TOKEN" --project vanjarijodi --non-interactive || echo "Note: Firestore rules deploy skipped"
          else
            echo "::error::No Firebase credentials found! Please set FIREBASE_SERVICE_ACCOUNT_VANJARIJODI or FIREBASE_SERVICE_ACCOUNT in GitHub repository Secrets."
            exit 1
          fi
