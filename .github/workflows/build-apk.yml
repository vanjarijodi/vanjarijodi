# ==============================================================================
# 🚀 Vanjari Jodi Matrimony — Production Android APK Build Workflow
# ==============================================================================
# Automates the compilation of installable Android APKs (Debug & Release)
# Triggers on push, pull request, or manual workflow dispatch from GitHub Actions.
# ==============================================================================

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, debug, release)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Setup Java 21 (Temurin Distribution for AGP 8.7+ & Gradle 8.9)
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Setup Android SDK Tools
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept SDK Licenses & Install Android 35 Platform Tools
      - name: 📜 Install Android SDK Platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 6. Install Node Modules
      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      # 7. Build Web Application Assets
      - name: 🌐 Build Vite Web Assets
        run: npm run build

      # 8. Sync Web Assets with Capacitor Android Platform
      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      # 9. Verify Gradle Wrapper & Prepare Android Environment
      - name: 🔧 Prepare Gradle & Resource Assets
        run: |
          chmod +x ./android/gradlew
          
          # Ensure Gradle wrapper jar exists
          if [ ! -s ./android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo ./android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9/gradle/wrapper/gradle-wrapper.jar
          fi

          # Ensure all PNG drawables are valid to prevent AAPT2 compile errors
          python3 -c "
          import os, base64
          valid_png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          for root, dirs, files in os.walk('./android/app/src/main/res'):
              for f in files:
                  p = os.path.join(root, f)
                  if f.endswith('.png') and ('splash' in f or os.path.getsize(p) == 0):
                      with open(p, 'wb') as img:
                          img.write(valid_png)
          "

      # 10. Handle Release Signing Keystore (from GitHub Secrets if present, or auto-generate)
      - name: 🔑 Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          else
            echo "Generating build release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias "${KEY_ALIAS:-vanjarijodi}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-vanjari123}" \
              -keypass "${KEY_PASSWORD:-vanjari123}" \
              -dname "CN=Vanjari Jodi Matrimony, OU=Mobile App, O=Vanjari Jodi, L=Mumbai, ST=Maharashtra, C=IN"
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          fi

      # 11. Compile Android Debug APK
      - name: 🔨 Build Android Debug APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd android
          ./gradlew assembleDebug -Pandroid.enablePngCrunchInReleaseBuilds=false --no-daemon --stacktrace

      # 12. Compile Android Release APK
      - name: 🚀 Build Android Release APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.enablePngCrunchInReleaseBuilds=false --no-daemon --stacktrace || true

      # 13. Organize Output APK Files
      - name: 📁 Prepare APK Artifacts
        run: |
          mkdir -p apk-output
          
          # Copy Debug APK
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/app-debug.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/VanjariJodi-debug.apk
            echo "✅ Debug APK built successfully"
          fi

          # Copy Release APK
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/VanjariJodi-release.apk
            echo "✅ Release APK built successfully"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/app-release-unsigned.apk
            echo "ℹ️ Unsigned Release APK copied"
          fi

          ls -lah apk-output/

      # 14. Upload Debug APK Artifact
      - name: 📤 Upload Debug APK (app-debug.apk)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30
          if-no-files-found: warn

      # 15. Upload Complete APK Package Artifact
      - name: 📤 Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: VanjariJodi-Android-APKs
          path: apk-output/
          retention-days: 30
          if-no-files-found: error
